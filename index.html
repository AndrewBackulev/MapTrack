<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPX → Apple Maps</title>
<style>
  body { font: 16px -apple-system, system-ui, sans-serif; margin: 0 auto; max-width: 600px; padding: 16px; background: #fff; color: #111; }
  a.btn { display: block; padding: 14px; margin: 12px 0; background: #007aff; color: #fff; text-align: center; border-radius: 10px; text-decoration: none; }
  ol { padding-left: 20px; } li { margin: 4px 0; }
  .muted { color: #666; font-size: 14px; }
  #map { height: 70vh; margin: 12px 0; border-radius: 10px; }
  button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; background: #fff; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<h1>GPX → Apple Maps</h1>
<p class="muted">Скачайте GPX на странице маршрута Wikiloc («Descargar»), затем выберите файл здесь.</p>
<input type="file" id="file" accept=".gpx,application/gpx+xml,application/xml,text/xml">
<div id="map" hidden></div>
<button id="me" hidden>Показать меня</button> <span id="gps" class="muted"></span>
<div id="out"></div>

<script>
// shortcut: Apple's multi-stop limit is undocumented; ~14 is a guess, raise if more work on device.
const MAX_STOPS = 14;

function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('Не удалось прочитать GPX');
  const pt = el => ({
    lat: +el.getAttribute('lat'), lon: +el.getAttribute('lon'),
    name: el.querySelector('name')?.textContent.trim() || ''
  });
  const ok = p => Number.isFinite(p.lat) && Number.isFinite(p.lon);
  return {
    wpts: [...doc.getElementsByTagName('wpt')].map(pt).filter(ok),
    trk: [...doc.getElementsByTagName('trkpt')].map(pt).filter(ok)
  };
}

function sample(arr, n) {
  if (arr.length <= n) return arr;
  return Array.from({ length: n }, (_, i) => arr[Math.round(i * (arr.length - 1) / (n - 1))]);
}

// Track start + waypoints (or sampled track points) + track end, capped at MAX_STOPS.
function pickStops({ wpts, trk }) {
  const inner = wpts.length ? wpts : sample(trk, MAX_STOPS).slice(1, -1);
  const stops = [trk[0], ...inner, trk[trk.length - 1]].filter(Boolean);
  if (stops.length < 2) throw new Error('В файле меньше двух точек');
  return sample(stops, MAX_STOPS);
}

const ll = p => p.lat.toFixed(6) + ',' + p.lon.toFixed(6);

function appleUrl(stops) {
  const q = ['saddr=' + ll(stops[0]), ...stops.slice(1).map(p => 'daddr=' + ll(p)), 'dirflg=w'];
  return 'https://maps.apple.com/?' + q.join('&');
}

// Google Maps URLs allow at most 9 waypoints between origin and destination.
function googleUrl(stops) {
  const s = sample(stops, 11);
  const wp = s.slice(1, -1).map(ll).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin=' + ll(s[0]) + '&destination=' + ll(s[s.length - 1]) +
    (wp ? '&waypoints=' + encodeURIComponent(wp) : '') + '&travelmode=walking';
}

function render(stops) {
  const segs = stops.slice(1).map((p, i) =>
    `<li><a href="${appleUrl([stops[i], p])}">${esc(stops[i].name || 'точка ' + (i + 1))} → ${esc(p.name || 'точка ' + (i + 2))}</a></li>`).join('');
  document.getElementById('out').innerHTML = `
    <a class="btn" href="${appleUrl(stops)}">Открыть весь маршрут в Apple Maps (точек: ${stops.length})</a>
    <a class="btn" style="background:#34a853" href="${googleUrl(stops)}">Открыть в Google Maps (точек: ${Math.min(stops.length, 11)})</a>
    <p class="muted">Если Apple Maps показала путь только до первой точки, открывайте по отрезкам:</p>
    <ol>${segs}</ol>`;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const gpx = parseGpx(await f.text());
    render(pickStops(gpx));
    showMap(gpx);
  } catch (err) { document.getElementById('out').textContent = err.message; }
});

let map, trackLayer, me, meAcc, watchId;

// Full track line + every waypoint; replaces the previous file's layers.
function showMap({ trk, wpts }) {
  const el = document.getElementById('map');
  el.hidden = false;
  document.getElementById('me').hidden = false;
  if (!map) {
    map = L.map(el);
    const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    const sat = L.layerGroup([
      L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, maxNativeZoom: 18, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
      }),
      L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18 })
    ]).addTo(map);
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    });
    L.control.layers({ 'Спутник': sat, 'Карта': osm }).addTo(map);
  }
  trackLayer?.remove();
  trackLayer = L.layerGroup().addTo(map);
  const line = L.polyline(trk.map(p => [p.lat, p.lon]), { color: '#e4572e', weight: 5 }).addTo(trackLayer);
  for (const w of wpts) {
    const m = L.circleMarker([w.lat, w.lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#222', fillOpacity: 1 }).addTo(trackLayer);
    if (w.name) m.bindPopup(document.createTextNode(w.name));
  }
  map.fitBounds(trk.length ? line.getBounds() : L.latLngBounds(wpts.map(w => [w.lat, w.lon])), { padding: [20, 20] });
}

let heading = null, hasCompass = false;

function setHeading(deg) {
  heading = deg;
  const svg = me?.getElement()?.querySelector('svg');
  if (svg) svg.style.transform = `rotate(${deg}deg)`;
}

// iOS gives webkitCompassHeading (0 = north, clockwise); Android gives absolute alpha (counter-clockwise).
function onOrientation(e) {
  const raw = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (raw == null) return;
  hasCompass = true;
  setHeading((raw + (screen.orientation?.angle ?? window.orientation ?? 0)) % 360);
}

function startCompass() {
  const listen = () => {
    addEventListener('deviceorientationabsolute', onOrientation);
    addEventListener('deviceorientation', onOrientation);
  };
  // iOS 13+ needs permission, and only from a tap.
  if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => r === 'granted' && listen()).catch(() => {});
  } else listen();
}

// A function so the page still works (Apple/Google links) if Leaflet fails to load.
const arrowIcon = () => L.divIcon({
  className: '', iconSize: [34, 34], iconAnchor: [17, 17],
  html: '<svg width="34" height="34" viewBox="0 0 34 34" style="transform-origin:50% 50%"><path d="M17 3 L28 29 L17 23 L6 29 Z" fill="#007aff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>'
});

document.getElementById('me').addEventListener('click', () => {
  const status = document.getElementById('gps');
  if (!navigator.geolocation) return status.textContent = 'Геолокация недоступна';
  if (watchId == null) startCompass();
  if (watchId != null) return me && map.setView(me.getLatLng(), Math.max(map.getZoom(), 16));
  status.textContent = 'Ищу GPS…';
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const at = [pos.coords.latitude, pos.coords.longitude];
    if (!me) {
      meAcc = L.circle(at, { radius: pos.coords.accuracy, weight: 0, fillColor: '#007aff', fillOpacity: 0.15 }).addTo(map);
      me = L.marker(at, { icon: arrowIcon(),interactive: false, keyboard: false }).addTo(map);
      if (heading != null) setHeading(heading);
    }
    me.setLatLng(at);
    // Without a compass, fall back to GPS course (only present while moving).
    if (!hasCompass && Number.isFinite(pos.coords.heading)) setHeading(pos.coords.heading);
    meAcc.setLatLng(at).setRadius(pos.coords.accuracy);
    if (first) { map.setView(at, Math.max(map.getZoom(), 16)); first = false; }
    status.textContent = `точность ±${Math.round(pos.coords.accuracy)} м`;
  }, err => {
    status.textContent = 'GPS: ' + err.message + ' (нужен https и разрешение на геолокацию)';
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }, { enableHighAccuracy: true, maximumAge: 5000 });
});

// Self-check
(() => {
  const gpx = `<gpx><wpt lat="43.1" lon="-4.1"><name>Puente</name></wpt>
    <trk><trkseg><trkpt lat="43.0" lon="-4.0"/><trkpt lat="43.05" lon="-4.05"/><trkpt lat="43.2" lon="-4.2"/></trkseg></trk></gpx>`;
  const url = appleUrl(pickStops(parseGpx(gpx)));
  console.assert(url === 'https://maps.apple.com/?saddr=43.000000,-4.000000&daddr=43.100000,-4.100000&daddr=43.200000,-4.200000&dirflg=w', url);
  const g = googleUrl(pickStops(parseGpx(gpx)));
  console.assert(g === 'https://www.google.com/maps/dir/?api=1&origin=43.000000,-4.000000&destination=43.200000,-4.200000&waypoints=43.100000%2C-4.100000&travelmode=walking', g);
  const many =Array.from({ length: 50 }, (_, i) => ({ lat: i, lon: i, name: '' }));
  console.assert(pickStops({ wpts: many, trk: many }).length === MAX_STOPS, 'cap');
})();
</script>
</body>
</html>
